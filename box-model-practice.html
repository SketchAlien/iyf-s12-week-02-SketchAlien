<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Practice</title>
    <style>
        .box {
        width: 200px;
        background: blue;
    }

    .content-only {
    }

    .with-padding {
        padding: 24px;
    }

    .with-border {
        padding: 24px;
        border: 4px solid;
    }

    .with-margin {
        padding: 24px;
        border: 4px solid;
        margin:32px;
    }

    .broken-box {
        width: 300px;
        padding: 20px;
        border: none;
        background:#ffe8a3;
        box-sizing: border-box
    }

    .card {
        width: 300px;
        padding: 20px;
        border: 1px solid gray;
        box-sizing: border-box;
    }
    </style> 
</head>
<body>
    <h1>Box Model Practice</h1>

    <h2>Exercise 1 - the four layers</h2>
    <div class="box content-only">Content</div>
    <div class="box with-padding">Padding</div>
    <div class="box with-border">Border</div>
    <div class="box with-margin">Margin</div>

    <h2>Exercise 2 - the broken box</h2>
    <div class="broken-box">I should be 300px wide. I am not</div>

    <h2>Exercise 3 - the card</h2>
    <article class="card">
        <img src="https://placehold.co/258x150" alt="Screenshot of African literarure analysis site">
        <h3>African English Literature Analysis</h3>
        <p>A website delving into Analysis of African literature for high school students</p>
        <button type="button">View project</button>
    </article>
    
</body>
</html>
